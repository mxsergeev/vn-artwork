name: Document reading transplant experiment
on:
  push:
    branches: [experiment/document-reading-transplants]
    paths:
      - 'experiments/13_document_reading_pose/build_candidate.py'
      - '.github/workflows/document-reading-transplant.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python experiments/13_document_reading_pose/build_candidate.py
      - name: Save experiment diagnostics to branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f experiments/13_document_reading_pose/candidate_review/*.png
          git diff --cached --quiet || git commit -m "Update document reading candidate diagnostics [skip ci]"
          git push
